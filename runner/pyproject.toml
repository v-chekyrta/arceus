[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arceus-runner"
version = "0.1.0"
description = "Bridge between YouTrack, GitLab and the Bulava engine"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "prometheus-client>=0.26,<0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3"]

[project.scripts]
arceus-runner = "arceus_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
