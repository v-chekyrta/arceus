<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{{ title or "Arceus" }}{% endblock %}{% if project %} · {{ project }}{% endif %}</title>
<link rel="stylesheet" href="{{ css }}">
<script src="{{ js }}" defer></script>
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <a class="brand" href="/">Arceus{% if project %} <span>{{ project }}</span>{% endif %}</a>
    {% if user %}
    <nav class="sections" aria-label="Sections"><ul class="nav">
      {% for href, label, here in nav %}
      <li><a href="{{ href }}"{% if here %} aria-current="page"{% endif %}>{{ label }}{% if href == "/users/" and pending %}<span class="count" title="{{ pending }} waiting for approval">{{ pending }}</span>{% endif %}</a></li>
      {% endfor %}
    </ul></nav>
    <div class="who">
      <a href="/account/" title="Your account">{{ user.name }}</a>
      <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="linkish" type="submit">Sign out</button></form>
    </div>
    {% endif %}
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="foot">Arceus console {{ version }}</footer>
</body>
</html>
