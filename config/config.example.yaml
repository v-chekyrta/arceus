# Runner settings for one project. Tokens go to secrets.env, not here. Unknown keys are errors.
# Check with: arceus-runner check

project: acme-shop                     # for logs, metrics, dashboards (a-z, 0-9, -)

# observe: read tracker and code host, log what would happen to events.jsonl, change nothing.
# live:    take tasks, run Bulava, push the commit Codex reviewed, open MRs.
mode: observe

# Where tasks come from. `type`: youtrack, or your own module (docs/integrations.md).
# Keys up to `states` are common to all trackers; the rest are per type.
tracker:
  type: youtrack
  bot_user: agent-runner               # the bot's login; its comments are ignored
  allowed_users:                       # who may start the agent with the queue tag
    - j.doe
    - a.smith
  tags:
    queue: agent
    needs_input: agent-needs-input
    failed: agent-failed
    research: agent-research           # with the queue tag: answer the question, no MR
  # Tags the runner adds to / removes from the ticket at its own steps. Optional, nothing by default.
  # The tags must already exist in YouTrack; the ones in `tags:` above are not allowed here.
  # tags_on:
  #   merged:                          # code ticket: every MR merged, none closed (moved to states.merged or not)
  #     add: [ready for dev]
  #     remove: [in development]
  #   answered:                        # research ticket (agent-research): the answer is posted, each /continue too
  #     add: [answered]
  states:
    queued: To Do
    in_progress: In Progress
    code_review: Code Review
    # merged: Testing                  # after every MR is merged (default Testing); null: stay in Code Review
    # answered: Code Review            # after a research answer (default code_review); null: stay In Progress
  # YouTrack
  url: https://youtrack.example.com
  project: ACME                        # YouTrack project ID
  state_field: State
  assignee_field: Assignee             # set to the bot on take; null: leave alone

# Repositories, MRs and CI. `type`: gitlab.
code_host:
  type: gitlab
  bot_user: acme-agent-bot             # the bot's username
  git_author: { name: "ACME Agent", email: "acme-agent-bot@example.com" }
  exclude_repos: []                    # repositories the agent never gets, e.g. [acme-infra]
  branch_prefix: agent/
  mr_label: agent
  # GitLab
  url: https://gitlab.example.com
  group: clients/acme                  # every task gets all its repositories; MRs only where something changed
  include_subgroups: true
  # For review_agent approvals: a second account (an author cannot approve its own MR), Developer or higher,
  # token in secrets.env. Without it the review only comments.
  # approver: { user: acme-review-bot, token_env: GITLAB_REVIEW_TOKEN }

# Optional: reports to the project's channel (what is told: runner/src/arceus_runner/notify.py).
# Remove the section for no Slack.
slack:
  webhook_env: SLACK_WEBHOOK_URL       # incoming webhook URL in secrets.env; test: arceus-runner slack-test
  # Who gets pinged: tracker login → Slack member ID (profile → ⋮ → Copy member ID). Empty: plain names.
  people: {}
  #   j.doe: U012AB3CD
  # alerts_channel: "#acme-agent"     # with SLACK_BOT_TOKEN: `check` verifies the token and the channel
  notify:
    summary_every: 30m          # a running task's progress, only when there is some
    summaries_off_hours: false  # false: off-hours summaries wait for the working day
    idle_after: 15m             # nothing to take this long in working hours: said once
    question_reminder: 24h      # repeat an unanswered question or held text, in working hours
    service_down_after: 10m     # tracker or code host silent this long
    runner_lifecycle: false     # tell runner starts and stops
    restart_quiet: 10m          # starts/stops closer than this are counted, not told one by one
    daily_status: true          # a summary at the start of each working day

schedule:
  timezone: Europe/Kyiv
  working_hours: { days: [mon, tue, wed, thu, fri], from: "09:00", to: "19:00" }
  poll_working: 2m
  poll_off_hours: 10m
  poll_local: 2m                       # local health
  poll_progress: 30s                   # a running task's steps and activity
  review_debounce: 5m
  repo_sync: 24h

http:
  connect_timeout: 10s
  read_timeout: 30s
  slow_response: 10s
  backoff: { start: 1m, max: 15m, jitter: 0.2 }

limits:
  max_review_rounds: 5          # review rounds that changed code
  max_review_answers: 20        # review rounds answered without a change
  max_ci_fix_attempts: 3
  needs_input_reminder: 24h
  needs_input_fail_after: 5d
  in_progress_alert_after: 6h
  attempt_timeout: 8h                  # no verdict this long: fails as "agent hung"
  agent_quiet_after: 20m               # agent silent this long: agent_quiet
  continue_window: 14d                 # `/continue` resumes a failed task within this

health:
  disk_warn_percent: 25
  disk_fail_percent: 10
  ram_warn_gb: 2
  token_expiry_warn_days: 14
  # Exits 0 only while the dev stack is up; a failure stops new tasks. Leave out until the stack exists.
  #   devstack_check: "cd ~/arceus/acme/<repo> && docker compose ps --status running --quiet | grep -q ."
  #   devstack_check: "make devstack-status"

bulava:
  codex_unavailable: fail              # fail | wait, when Codex is out of quota or signed out
  report_language: English             # the agent's fallback language (commits, MR summary)
  codex_unavailable_after_hours: 3
  mcp_config: /opt/bulava-local/mcp.json   # the preinstalled headless browser
  # Models for newly dispatched tasks. auto: the CLI's defaults.
  claude_model: auto                   # auto | opus | sonnet | haiku | fable | exact id (claude-opus-5-5)
  claude_effort: auto                  # auto | none (haiku) | low | medium | high | xhigh | max | ultracode
  codex_model: auto                    # auto | a slug from `night-shift models codex`
  codex_effort: auto                   # auto | low | medium | high | xhigh | max | ultra
  start_handshake_wait: 30s            # 5s–2m for a new session to confirm its start

# Every ticket, comment and CI log is screened by Claude before the agent sees it. A suspicious text
# waits for `/security-allow <code>` or `/security-reject <code>` on the ticket.
security:
  reviewers:                           # who decides on held texts; required in live mode
    - a.smith
  model: auto                          # auto | sonnet | opus | exact id
  timeout: 3m

# `/review` on a ticket in Code Review (by tracker.allowed_users): a separate task reviews, builds and
# tests the open MRs. Approves (as code_host.approver) only when ready, CI green on the reviewed commit
# and nothing moved; otherwise notes what to change, and the author fixes it (fix_rounds). Risky changes
# get a note for a person even when approved. Details: docs/reviews.md.
review_agent:
  enabled: false
  command: /review
  require_green_ci: true               # newest CI run is for the reviewed commit and passed
  timeout: 2h                          # past it nothing is approved
  max_suggestions: 5                   # non-blocking ideas per MR
  max_per_ticket: 10
  fix_rounds: 3                        # 0: people pass findings on
  # Per repository (path or * ? pattern; exact path wins): build/tests required (default) | none.
  # ci_build_jobs/ci_test_jobs: CI jobs that stand in for what the reviewer cannot run itself.
  # repos:
  #   services/api: {ci_build_jobs: ["build"], ci_test_jobs: ["pytest", "pytest-*"]}
  #   infra/deploy: {build: none}
  # attention_paths: changed files always shown to a person (default: auth, permission, crypt, secret, .env).
  # review_hint_paths: files read with extra care (default: CI, Docker, deps, migrations…). See config.py.
  # Pattern without / matches the file name anywhere; ** crosses folders. A list here replaces the default.
  #   attention_paths: ["**/migrations/**", "*auth*", ".gitlab-ci.yml"]

# Optional. The agent tests the platform by your instructions and writes a report (qa.py).
# `arceus-runner qa run` or `schedule` queues a run; it changes nothing.
# Reports: http://localhost:3300/ over an SSH tunnel (ssh -L 3300:127.0.0.1:3300 …).
qa:
  enabled: false
  instructions: ~/arceus/data/qa/instructions.md   # what to test; setup.sh creates a template to fill in
  reports: ~/arceus/data/qa/runs                   # report.html, result.json, media/ per run
  # schedule: { days: [mon, tue, wed, thu, fri], at: "02:00" }   # in schedule.timezone
  timeout: 8h                                      # past it the run stops, reported as unfinished
  port: 3300                                       # 127.0.0.1 only

# Optional. The agent reviews the architecture and reports what needs a decision (docs/architect.md).
# `arceus-runner arch run` or `schedule` (weekly is enough); reads only repositories changed since the last
# review, changes nothing. Reports: http://localhost:3301/ over an SSH tunnel.
architect:
  enabled: false
  instructions: ~/arceus/data/architect/instructions.md   # optional; setup.sh creates a template
  reports: ~/arceus/data/architect/runs              # report.html, result.json per run
  # schedule: { days: [sun], at: "03:00" }           # in schedule.timezone
  timeout: 4h
  # Repository path patterns; `repo:path` for paths inside a repository.
  # repos: []                    # what to review; empty: everything
  # skip: []                     # never reviewed, e.g. ["*:**/migrations/**"]
  # not_ours: []                 # code you build on but do not own: read only; edits inside it are flagged
  first_look: 30d                # how far back the first review looks
  max_findings: 7
  second_opinion: true           # Codex checks the findings before the report
  second_opinion_timeout: 20m
  port: 3301                     # 127.0.0.1 only

# Removes what finished tasks left: containers, volumes, dev servers, files, media. Only things tied to a
# task that is over (label arceus.task=<KEY>, .arceus/<kind>/<KEY>, its branch, or made while it held the
# workspace). `arceus-runner cleanup` shows the plan.
cleanup:
  mode: report                         # report: only log | act: remove. Start with report.
  idle_after: 15m                      # run once the workspace is free this long
  min_interval: 6h
  force_every: 24h
  release_after: 3d                    # a waiting task idle this long loses what is marked disposable
  orphaned_volumes_after: 24h          # a task's leftover anonymous volumes
  prune_unowned_volumes: false         # true: also unused volumes of no task (docker volume prune)
  build_cache_after: 7d                # build cache no build used this long; null: only reported
  dangling_images_after: 7d            # untagged images no container uses; null: only counted
  unused_images_after: null            # e.g. 30d: also old tagged images without a task label
  keep_media: 14d
  keep_notes: 90d
  llm: off                             # advise: Claude comments on what nobody owns; never removes
  protect:                             # never touched (plus arceus-observability and arceus.keep=true)
    compose_projects: []               # e.g. the dev stack's compose project
    images: []                         # e.g. [postgres, "node:*"]: never removed by any rule

# Web console (docs/console.md): status, reports, Grafana, settings behind one sign-in.
console:
  enabled: false
  # public_url: https://console.example.com   # required when enabled
  port: 80                                  # nginx here; the load balancer forwards public_url to it
  tls: false                                # true if the load balancer talks HTTPS to backends

paths:
  workspace: ~/arceus/workspace
  bulava: /opt/bulava/engine           # engine folder
  bulava_state: ~/.claude/supervisor   # SUPERVISOR_STATE_DIR
  bulava_env: ~/arceus/data/bulava.env # Claude token, for Bulava only
  secrets: ~/arceus/data/secrets.env   # read by the runner, never put in its environment
  db: ~/arceus/data/runner.db
  events: ~/arceus/data/events.jsonl
  project_notes: ~/arceus/data/project-notes.md   # added to every task's AGENTS.md; remove for none
