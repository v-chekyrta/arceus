# Observability for one VM: Grafana with Prometheus (runner and machine
# metrics) and Loki (runner and Bulava events). Everything listens on 127.0.0.1 only; Grafana is
# reached through an SSH tunnel: ssh -L 3000:127.0.0.1:3000 <user>@<vm>.
# setup.sh installs this folder to /opt/arceus-observability and writes .env next to it.
name: arceus-observability

services:
  grafana:
    image: grafana/grafana:13.0.10
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # reachable only through the tunnel; viewers need no login
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/arceus-now.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ${GRAFANA_ADMIN_FILE}:/run/secrets/grafana_admin:ro

  prometheus:
    image: prom/prometheus:v3.13.4
    network_mode: host
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    image: grafana/loki:3.7.8
    network_mode: host
    restart: unless-stopped
    command: [-config.file=/etc/loki/loki.yaml]
    volumes:
      - loki-data:/loki
      - ./loki.yaml:/etc/loki/loki.yaml:ro

  alloy:
    image: grafana/alloy:v1.20.1
    network_mode: host
    restart: unless-stopped
    command: [run, --server.http.listen-addr=127.0.0.1:12345, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    volumes:
      - alloy-data:/var/lib/alloy
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ${ARCEUS_DATA}:/arceus-data:ro          # runner: events.jsonl
      - ${BULAVA_STATE}:/bulava-state:ro         # engine: tasks/<key>/events.jsonl

  node-exporter:
    image: prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    restart: unless-stopped
    command: [--path.rootfs=/host, --web.listen-address=127.0.0.1:9100]
    volumes:
      - /:/host:ro,rslave

volumes:
  grafana-data:
  prometheus-data:
  loki-data:
  alloy-data:
