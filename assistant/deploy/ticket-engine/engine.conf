# Night Shift for the assistant's tickets (~<engine user>/engine.conf, written by setup.sh). Not secret: a sign-in
# token, if any, is in engine.env.
# Read by the engine's tmux service and by fa-ticket-engine for every call, so both run the same engine.
SUPERVISOR_PROFILE=server
SUPERVISOR_REPORT_LANGUAGE=Ukrainian
# A ticket is one short research task: no positions and alignment before it (that was 106 s of 139 in the trial)...
SUPERVISOR_COLLABORATION_MODE=legacy
SUPERVISOR_PREFLIGHT_ENABLE=0
# ...but Codex reviews the ticket the worker writes (server research review), one reviewer, no pre-review checks.
SUPERVISOR_SERVER_RESEARCH_REVIEW=1
SUPERVISOR_REVIEW_TEAM=off
SUPERVISOR_CLAUDE_CHECKS=0
SUPERVISOR_CLAUDE_MODEL=sonnet
SUPERVISOR_CLAUDE_EFFORT=low
SUPERVISOR_CODEX_MODEL=gpt-6.1-terra
SUPERVISOR_CODEX_EFFORT=low
# Codex away: the ticket falls back to the assistant's own draft at once, marked unchecked; nothing waits for hours.
SUPERVISOR_CODEX_UNAVAILABLE=fail
SUPERVISOR_CODEX_UNAVAILABLE_AFTER_HOURS=0
DISABLE_AUTOUPDATER=1
PATH=/usr/local/bin:@HOME@/.local/bin:/usr/bin:/bin
